name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        # Before Week 1 Day 3 (all 3 browsers + their Linux packages). Kept in case we need it,
        # e.g. when Firefox and WebKit come back in Week 9:
        # run: npx playwright install --with-deps
        # Now Chromium only: the one browser in playwright.config.ts. Fewer Linux packages
        # = faster install, and it can't fail on WebKit/Firefox package downloads.
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
